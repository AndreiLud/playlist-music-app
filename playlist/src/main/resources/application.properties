spring.application.name=playlist

# Porta na qual todos os endpoints (musicas, playlists, reproducao e api) sao publicados
server.port=8080

# Banco de dados H2 em memoria
spring.datasource.url=jdbc:h2:mem:playlistdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# O schema e a carga inicial sao criados exclusivamente pelo data.sql
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# URL utilizada pelos clientes Open Feign do microservico api
url=http://localhost:8080

# Erros retornam apenas a mensagem, sem stack trace no corpo da resposta
# (o devtools sobrepoe os defaults de erro; add-properties=false mantem o comportamento de producao)
spring.devtools.add-properties=false
server.error.include-stacktrace=never

# Actuator: http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.music.playlist=DEBUG
